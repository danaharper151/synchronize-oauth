<!DOCTYPE html>
<html>
<head><title>Synchronize Auth</title></head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    window.location.href = 'com.synchronize.app://oauth/callback?code=' + code;
  }
</script>
<p>Redirecting back to Synchronize...</p>
</body>
</html>
