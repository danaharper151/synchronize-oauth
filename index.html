<!DOCTYPE html>
<html>
<head><title>Synchronize Auth</title></head>
<body>
<script>
  // Forward ALL query parameters to the app, not just the code
  const params = window.location.search;
  if (params) {
    window.location.href = 'com.synchronize.app://oauth/callback' + params;
  }
</script>
<p>Redirecting back to Synchronize...</p>
</body>
</html>
